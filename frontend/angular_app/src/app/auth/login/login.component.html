<div class="auth-container">
  <div class="auth-box">
    <h2>CivicPulse Login</h2>
    <p class="subtitle">Smart City Citizen Portal</p>

    <form (ngSubmit)="login()">

      <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          (input)="errorMessage=''"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          (input)="errorMessage=''"
        />
      </div>

      <button type="submit">Login</button>

      <p class="switch">
        Don’t have an account?
        <a routerLink="/register">Register Now</a>
      </p>
    </form>
  </div>
</div>
