<div class="auth-container">
  <div class="auth-box">

    <h2>Create Your Account</h2>
    <p class="subtitle">Join CivicPulse Citizen Portal</p>

    <form (ngSubmit)="register()" #registerForm="ngForm">

      <!-- Full Name -->
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          required
          #nameRef="ngModel"
        />
        <div class="field-error" *ngIf="nameRef.invalid && registerForm.submitted">
          Required
        </div>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label>Mobile Number</label>
        <input
          type="text"
          name="mobile"
          [(ngModel)]="mobile"
          required
          pattern="[0-9]{10}"
          #mobileRef="ngModel"
        />
        <div class="field-error" *ngIf="mobileRef.invalid && registerForm.submitted">
          Enter valid 10-digit mobile number
        </div>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label>Address</label>
        <input
          type="text"
          name="address"
          [(ngModel)]="address"
          required
          #addressRef="ngModel"
        />
        <div class="field-error" *ngIf="addressRef.invalid && registerForm.submitted">
          Required
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          #emailRef="ngModel"
        />
        <div class="field-error" *ngIf="emailRef.invalid && registerForm.submitted">
          Enter valid email
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          #passwordRef="ngModel"
        />
        <div class="field-error" *ngIf="passwordRef.invalid && registerForm.submitted">
          Minimum 6 characters required
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
        />
        <div class="field-error"
             *ngIf="registerForm.submitted && password !== confirmPassword">
          Passwords do not match
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="registerForm.invalid">
        Register
      </button>

      <p class="switch">
        Already have an account?
        <a routerLink="/login">Login Here</a>
      </p>

    </form>
  </div>
</div>
