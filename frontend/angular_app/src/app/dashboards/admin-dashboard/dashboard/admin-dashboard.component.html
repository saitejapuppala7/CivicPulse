<h1>Dashboard Overview</h1>

<div class="cards">

  <div class="card">
    <h3>Total Complaints</h3>
    <p>{{ totalComplaints }}</p>
  </div>

  <div class="card">
    <h3>Pending Complaints</h3>
    <p>{{ pendingComplaints }}</p>
  </div>

  <div class="card">
    <h3>Accepted</h3>
    <p>{{ acceptedComplaints }}</p>
  </div>

  <div class="card">
    <h3>Rejected</h3>
    <p>{{ rejectedComplaints }}</p>
  </div>

</div>
