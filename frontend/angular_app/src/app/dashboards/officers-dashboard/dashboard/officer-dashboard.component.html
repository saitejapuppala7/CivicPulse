<h1>Dashboard Overview</h1>

<div class="cards">

  <div class="card">
    <h3>Total Complaints</h3>
    <p>{{ totalComplaints }}</p>
  </div>

  <div class="card">
    <h3>Pending Complaints</h3>
    <p>{{ pendingComplaints }}</p>
  </div>

  <div class="card">
    <h3>Resolved</h3>
    <p>{{ resolvedComplaints }}</p>
  </div>

  <div class="card">
    <h3>High Priority</h3>
    <p>{{ highPriorityComplaints }}</p>
  </div>

</div>
